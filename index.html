<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Counter Compact</title>
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --big-red: #ff0000; --bonus-blue: #00d4ff; }
        
        /* 連打時の拡大防止 & 全体最適化 */
        * { touch-action: manipulation; box-sizing: border-box; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 5px; font-size: 14px; overflow-x: hidden; }
        .container { max-width: 400px; margin: 0 auto; }

        /* 回転数エリアをスリムに */
        .total-area { background: #1a1a1a; padding: 8px; border-radius: 10px; border: 1px solid var(--jug-gold); margin-bottom: 5px; }
        input[type="number"] { background: #333; color: #fff; border: none; font-size: 1.8rem; width: 60%; text-align: center; border-radius: 5px; padding: 5px; font-weight: bold; margin-bottom: 5px; }
        .quick-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 8px; }
        .btn-q { background: #444; color: #fff; border: none; padding: 8px; border-radius: 5px; font-size: 0.9rem; font-weight: bold; }
        
        /* 合算表示を一行に */
        .summary-area { background: #000; padding: 5px; border-radius: 8px; border: 1px solid var(--bonus-blue); display: flex; justify-content: space-around; align-items: center; margin-bottom: 5px; }
        .sum-item { display: flex; align-items: center; gap: 5px; }
        .sum-label { font-size: 0.7rem; color: var(--bonus-blue); }
        .sum-val { font-size: 1.1rem; font-weight: bold; }
        .sum-prob { color: var(--jug-gold); font-size: 1rem; font-weight: bold; }
        .top-judge { font-size: 0.9rem; color: var(--good-green); font-weight: bold; height: 1.2rem; margin-bottom: 2px; }

        /* グリッドを詰める */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
        .card { background: #1a1a1a; border-radius: 8px; padding: 8px; text-align: center; border: 1px solid #333; }
        .grape { border-top: 3px solid var(--good-green); }
        .cherry { border-top: 3px solid #ff8c00; }
        .big { border-top: 3px solid var(--big-red); }
        .reg { border-top: 3px solid var(--jug-pink); }
        .ch-big { border-top: 3px dashed var(--big-red); }
        .ch-reg { border-top: 3px dashed var(--jug-pink); }
        
        .label { font-size: 0.75rem; color: #ccc; }
        .count-val { font-size: 2rem; font-weight: bold; margin: 2px 0; }
        .prob { color: var(--jug-gold); font-size: 0.85rem; font-weight: bold; min-height: 1rem; }
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 12px; border-radius: 8px; font-size: 1.5rem; margin-top: 3px; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #222; padding: 3px; border-radius: 4px; font-size: 0.7rem; margin-top: 5px; width: 100%; }
        
        .judge-msg { font-size: 0.65rem; color: #666; margin-top: 3px; height: 0.8rem; }
        .good { color: var(--good-green); }

        /* 広告・コラムもコンパクトに */
        .ad-space { background: #111; margin: 10px 0; padding: 10px; border-radius: 8px; border: 1px dashed #444; font-size: 0.8rem; }
        .column-section { background: #111; padding: 10px; border-radius: 8px; font-size: 0.75rem; color: #aaa; text-align: left; }
        .column-title { color: var(--jug-gold); font-weight: bold; margin-bottom: 5px; display: block; }
        
        .reset-container { margin: 15px 0; text-align: center; }
        .btn-reset { background: #551111; color: #999; border: none; padding: 8px 20px; border-radius: 20px; font-size: 0.8rem; }
        .footer-links { font-size: 0.65rem; color: #444; padding-bottom: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="total-area">
        <input type="number" id="totalDisplay" value="0" oninput="updateFromInput()">
        <div class="quick-btns">
            <button class="btn-q" onclick="addG(1)">+
