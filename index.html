<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ジャグラー設定判別ツール | 究極のボーナス合算カウンター</title>
    <meta name="description" content="ジャグラーシリーズ全般に対応した設定判別ツールです。単独・チェリー重複ボーナスやブドウ確率をカウントし、高精度な設定推測をサポートします。">
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --big-red: #ff0000; --cherry-orange: #ff8c00; --bonus-blue: #00d4ff; }
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #000; color: white; margin: 0; padding: 10px; -webkit-tap-highlight-color: transparent; }
        .container { max-width: 450px; margin: 0 auto; }
        
        /* メインカウンター部分 */
        .total-area { background: #1a1a1a; padding: 15px; border-radius: 12px; border: 2px solid var(--jug-gold); margin-bottom: 10px; text-align: center; }
        input[type="number"] { background: #333; color: #fff; border: none; font-size: 2.2rem; width: 70%; text-align: center; border-radius: 8px; padding: 8px; font-weight: bold; margin-bottom: 10px; }
        .quick-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .btn-q { background: #444; color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
        
        .summary-area { background: #000; padding: 10px; border-radius: 10px; border: 1px solid var(--bonus-blue); display: flex; justify-content: space-around; align-items: center; margin-bottom: 10px; }
        .sum-item { text-align: center; }
        .sum-label { font-size: 0.8rem; color: var(--bonus-blue); }
        .sum-val { font-size: 1.5rem; font-weight: bold; }
        .sum-prob { color: var(--jug-gold); font-weight: bold; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: #1a1a1a; border-radius: 12px; padding: 12px; text-align: center; border: 1px solid #333; }
        .grape { border-top: 5px solid var(--good-green); }
        .cherry { border-top: 5px solid var(--cherry-orange); }
        .big { border-top: 5px solid var(--big-red); }
        .reg { border-top: 5px solid var(--jug-pink); }
        .ch-big { border-top: 5px dashed var(--big-red); }
        .ch-reg { border-top: 5px dashed var(--jug-pink); }
        
        .label { font-size: 0.85rem; font-weight: bold; color: #ccc; }
        .count-val { font-size: 2.5rem; font-weight: bold; margin: 5px 0; line-height: 1; }
        .prob { color: var(--jug-gold); font-size: 0.9rem; font-weight: bold; min-height: 1.2rem; }
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 18px; border-radius: 10px; font-size: 2rem; cursor: pointer; margin-top: 5px; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #444; padding: 6px; border-radius: 5px; font-size: 0.8rem; margin-top: 8px; width: 100%; cursor: pointer; }
        
        .judge-msg { font-size: 0.7rem; margin-top: 8px; font-weight: bold; color: #666; min-height: 1rem; }
        .good { color: var(--good-green); }
        .top-judge { font-size: 1rem; color: var(--good-green); font-weight: bold; margin-bottom: 5px; }

        /* 収益化・審査対策セクション */
        .ad-space { background: #222; margin: 20px 0; padding: 20px; border-radius: 10px; text-align: center; border: 1px dashed #555; }
        .ad-label { font-size: 0.7rem; color: #666; margin-bottom: 10px; display: block; }
        
        .column-section { background: #1a1a1a; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; }
        .column-title { color: var(--jug-gold); font-size: 1.1rem; border-left: 4px solid var(--jug-gold); padding-left: 10px; margin-bottom: 15px; }
        .column-content { font-size: 0.85rem; color: #ccc; line-height: 1.6; }

        .affiliate-box { background: white; color: black; padding: 10px; border-radius: 8px; display: flex; align-items: center; gap: 10px; text-decoration: none; margin-top: 10px; }
        .aff-img { width: 50px; height: 50px; background: #eee; border-radius: 4px; }
        .aff-text { font-size: 0.8rem; font-weight: bold; }

        .footer-links { margin-top: 30px; font-size: 0.7rem; color: #555; border-top: 1px solid #222; padding-top: 15px; }
        .footer-links a { color: #555; margin: 0 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="total-area">
        <input type="number" id="totalDisplay" value="0" oninput="updateFromInput()">
        <div class="quick-btns">
            <button class="btn-q" onclick="addG(1)">+1</button>
            <button class="btn-q" onclick="addG(10)">+10</button>
            <button class="btn-q" onclick="addG(100)">+100</button>
        </div>
        <div id="total-judge" class="top-judge"></div>
        <div class="summary-area">
            <div class="sum-item"><div class="sum-label">BIG+REG</div><div id="total-bonus-count" class="sum-val">0</div></div>
            <div class="sum-item"><div class="sum-label">合算確率</div><div id="total-bonus-prob" class="sum-prob">-</div></div>
        </div>
    </div>

    <div class="grid" id="counterGrid"></div>

    <div class="ad-space">
        <span class="ad-label">スポンサーリンク</span>
        <p style="font-size:0.8rem; color:#888;">ここに広告が表示されます</p>
        
        <a href="https://amzn.to/your-link" class="affiliate-box">
            <div class="aff-img">🎁</div>
            <div class="aff-text">【実戦必須】勝ち組が使うスマホスタンドを見る</div>
        </a>
    </div>

    <div class="column-section">
        <h3 class="column-title">ジャグラー設定推測の極意</h3>
        <div class="column-content">
            ジャグラーで勝率を上げるためには、単なるボーナス回数だけでなく、ブドウ確率や単独・重複の判別が不可欠です。本ツールはマイジャグラーVやアイムジャグラーEXなど、主要機種の平均的な数値をベースに設計されています。500G以上回した段階から信頼度が上がりますので、粘り強くカウントしていきましょう。
        </div>
    </div>

    <div style="text-align:center; margin-top:20px;">
        <button onclick="res()" style="background:#cc0000; color:white; border:none; padding:10px 20px; border-radius:50px; font-weight:bold;">全リセット</button>
    </div>

    <div class="footer-links">
        <div style="margin-bottom:10px;">
            ※本ツールは個人で開発されたものであり、遊技の結果を保証するものではありません。
        </div>
        <a href="#">利用規約</a> | <a href="#">プライバシーポリシー</a> | <a href="#">免責事項</a>
    </div>
</div>

<script>
    // ※JavaScriptの中身は12.0版と同じ（保存先をv9に変更）
    let state = JSON.parse(localStorage.getItem('j-state-v9')) || {
        totalG: 0,
        counts: [0, 0, 0, 0, 0, 0], 
        labels: ["ブドウ", "チェリー", "単独BIG", "単独REG", "チェ重BIG", "チェ重REG"],
        classes: ["grape", "cherry", "big", "reg", "ch-big", "ch-reg"]
    };

    function save() { localStorage.setItem('j-state-v9', JSON.stringify(state)); render(); }
    function addG(val) { state.totalG += val; save(); }
    function updateFromInput() {
        const val = document.getElementById('totalDisplay').value;
        state.totalG = val === "" ? 0 : parseInt(val);
        localStorage.setItem('j-state-v9', JSON.stringify(state));
        render();
    }
    function up(i) { state.counts[i]++; save(); }
    function down(i) { if(state.counts[i] > 0) state.counts[i]--; save(); }
    function res() { if(confirm("データを全消去しますか？")) { state.totalG = 0; state.counts = [0,0,0,0,0,0]; save(); } }

    function render() {
        document.getElementById('totalDisplay').value = state.totalG;
        const grid = document.getElementById('counterGrid');
        grid.innerHTML = '';
        const bigTotal = state.counts[2] + state.counts[4];
        const regTotal = state.counts[3] + state.counts[5];
        const bonusTotal = bigTotal + regTotal;
        const bonusProb = state.totalG > 0 && bonusTotal > 0 ? (state.totalG / bonusTotal).toFixed(1) : "-";
        document.getElementById('total-bonus-count').innerText = bonusTotal;
        document.getElementById('total-bonus-prob').innerText = bonusProb !== "-" ? "1 / " + bonusProb : "-";

        const topJudge = document.getElementById('total-judge');
        if(state.totalG >= 500 && bonusProb !== "-") {
            if(bonusProb < 125) topJudge.innerText = "🔥 ぶっちぎりの設定6以上！ 🔥";
            else if(bonusProb < 140) topJudge.innerText = "✨ 高設定濃厚（5-6並） ✨";
            else topJudge.innerText = "";
        }

        state.counts.forEach((v, i) => {
            const p = state.totalG > 0 && v > 0 ? (state.totalG / v).toFixed(1) : "-";
            const card = document.createElement('div');
            card.className = `card ${state.classes[i]}`;
            let judge = "-";
            let judgeClass = "judge-msg";
            if(state.totalG >= 500) {
                if(i === 0) { const prob = state.totalG / v; if(prob < 5.8) { judge = "設定6並！"; judgeClass += " good"; } }
                else if(i === 3 || i === 5) { const rProb = state.totalG / regTotal; if(rProb < 320) { judge = "期待度高"; judgeClass += " good"; } }
            }
            card.innerHTML = `<div class="label">${state.labels[i]}</div><div class="count-val">${v}</div><div class="prob">1 / ${p}</div><button class="btn-up" onclick="up(${i})">＋</button><button class="btn-minus" onclick="down(${i})">－ 1</button><div class="${judgeClass}">${judge}</div>`;
            grid.appendChild(card);
        });
    }
    render();
</script>
</body>
</html>
