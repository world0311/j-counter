<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Counter Drum-Loop</title>
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --big-red: #ff0000; --cherry-orange: #ff8c00; --bonus-blue: #00d4ff; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 5px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden; }
        .container { max-width: 100%; height: 100vh; display: flex; flex-direction: column; }
        
        /* 入力エリアをさらに薄く */
        .total-area { background: #1a1a1a; padding: 5px; border-radius: 10px; border: 1px solid var(--jug-gold); margin-bottom: 5px; text-align: center; }
        .drum-container { display: flex; justify-content: center; align-items: center; gap: 3px; }
        .drum-digit { display: flex; flex-direction: column; align-items: center; }
        .drum-val { font-size: 1.8rem; font-weight: bold; width: 40px; background: #333; border-radius: 4px; margin: 2px 0; }
        .btn-arrow { background: #444; border: none; color: white; width: 42px; height: 30px; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        
        .summary-area { background: #000; padding: 4px; border-radius: 8px; border: 1px solid var(--bonus-blue); display: flex; justify-content: space-around; font-size: 0.9rem; margin-top: 5px; }
        .sum-prob { color: var(--jug-gold); font-weight: bold; }
        .top-judge { font-size: 0.85rem; color: var(--good-green); font-weight: bold; min-height: 1.1rem; margin-top: 2px; }

        /* グリッド：隙間を最小限に */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px; flex: 1; }
        .card { background: #1a1a1a; border-radius: 8px; padding: 5px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        
        .grape { border-top: 3px solid var(--good-green); }
        .cherry { border-top: 3px solid var(--cherry-orange); }
        .big { border-top: 3px solid var(--big-red); }
        .reg { border-top: 3px solid var(--jug-pink); }
        .ch-big { border-top: 3px dashed var(--big-red); }
        .ch-reg { border-top: 3px dashed var(--jug-pink); }
        
        .label { font-size: 0.75rem; font-weight: bold; color: #ccc; }
        .count-val { font-size: 1.8rem; font-weight: bold; line-height: 1; margin: 2px 0; }
        .prob { color: var(--jug-gold); font-size: 0.8rem; font-weight: bold; }
        
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 10px 0; border-radius: 6px; font-size: 1.4rem; cursor: pointer; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #444; padding: 2px; border-radius: 4px; font-size: 0.65rem; margin-top: 3px; width: 100%; }
        
        .judge-msg { font-size: 0.6rem; margin-top: 2px; color: #555; }
        .good { color: var(--good-green); }

        .btn-reset { background: #cc0000; color: white; border: none; padding: 5px 15px; border-radius: 20px; font-size: 0.7rem; margin: 5px auto; display: block; }
        .notes { font-size: 0.55rem; color: #444; text-align: center; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div class="total-area">
        <div class="drum-container">
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(1000, 1)">▲</button><div id="d4" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1000, -1)">▼</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(100, 1)">▲</button><div id="d3" class="drum-val">0</div><button class="btn-arrow" onclick="drum(100, -1)">▼</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(10, 1)">▲</button><div id="d2" class="drum-val">0</div><button class="btn-arrow" onclick="drum(10, -1)">▼</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(1, 1)">▲</button><div id="d1" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1, -1)">▼</button></div>
        </div>
        <div class="summary-area">
            <div id="total-bonus-count">合算:0</div>
            <div id="total-bonus-prob" class="sum-prob">1 / -</div>
        </div>
        <div id="total-judge" class="top-judge"></div>
    </div>

    <div class="grid" id="counterGrid"></div>

    <button class="btn-reset" onclick="res()">リセット</button>
    <div class="notes">※平均値参考。自己責任でお願いします。</div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('j-state-v11')) || {
        totalG: 0,
        counts: [0, 0, 0, 0, 0, 0], 
        labels: ["ブドウ", "チェリー", "単独BIG", "単独REG", "重BIG", "重REG"],
        classes: ["grape", "cherry", "big", "reg", "ch-big", "ch-reg"]
    };

    function save() { 
        localStorage.setItem('j-state-v11', JSON.stringify(state)); 
        updateDrumDisplay();
        render(); 
    }

    // ドラム入力のループ処理（0で下を押すと9になる）
    function drum(unit, dir) {
        let currentDigit = Math.floor(state.totalG / unit) % 10;
        let nextDigit = (currentDigit + dir + 10) % 10;
        state.totalG += (nextDigit - currentDigit) * unit;
        save();
    }

    function updateDrumDisplay() {
        let val = state.totalG;
        document.getElementById('d4').innerText = Math.floor(val / 1000 % 10);
        document.getElementById('d3').innerText = Math.floor(val / 100 % 10);
        document.getElementById('d2').innerText = Math.floor(val / 10 % 10);
        document.getElementById('d1').innerText = Math.floor(val % 10);
    }

    function up(i) { state.counts[i]++; save(); }
    function down(i) { if(state.counts[i] > 0) state.counts[i]--; save(); }
    function res() { if(confirm("リセット？")) { state.totalG = 0; state.counts = [0,0,0,0,0,0]; save(); } }

    function render() {
        const grid = document.getElementById('counterGrid');
        grid.innerHTML = '';
        const bigTotal = state.counts[2] + state.counts[4];
        const regTotal = state.counts[3] + state.counts[5];
        const bonusTotal = bigTotal + regTotal;
        const bonusProb = state.totalG > 0 && bonusTotal > 0 ? (state.totalG / bonusTotal).toFixed(1) : "-";

        document.getElementById('total-bonus-count').innerText = "合算:" + bonusTotal;
        document.getElementById('total-bonus-prob').innerText = "1/" + bonusProb;

        const topJudge = document.getElementById('total-judge');
        if(state.totalG >= 500 && bonusProb !== "-") {
            if(bonusProb < 135) topJudge.innerText = "🔥 高設定期待！";
            else if(bonusProb > 160) topJudge.innerText = "💀 厳しい状況";
            else topJudge.innerText = "⚖️ 中間付近";
        } else { topJudge.innerText = ""; }

        state.counts.forEach((v, i) => {
            const p = state.totalG > 0 && v > 0 ? (state.totalG / v).toFixed(1) : "-";
            const card = document.createElement('div');
            card.className = `card ${state.classes[i]}`;
            
            // 判定ロジック
            let judgeText = "500G〜";
            let judgeClass = "judge-msg";
            if(state.totalG >= 500) {
                judgeText = "-";
                if(i === 0 && state.totalG/v < 6.0) { judgeText = "高設定並"; judgeClass += " good"; }
                if((i === 3 || i === 5) && (state.totalG/regTotal < 300)) { judgeText = "REG良し"; judgeClass += " good"; }
            }

            card.innerHTML = `
                <div class="label">${state.labels[i]}</div>
                <div class="count-val">${v}</div>
                <div class="prob">1/${p}</div>
                <button class="btn-up" onclick="up(${i})">＋</button>
                <button class="btn-minus" onclick="down(${i})">－1</button>
                <div class="${judgeClass}">${judgeText}</div>
            `;
            grid.appendChild(card);
        });
    }
    updateDrumDisplay();
    render();
</script>

</body>
</html>
