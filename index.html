<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Counter Smart</title>
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --big-red: #ff0000; --cherry-orange: #ff8c00; --bonus-blue: #00d4ff; }
        
        /* 画面全体のスクロールや拡大を抑える */
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 8px; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow-x: hidden; }
        .container { max-width: 100%; margin: 0 auto; }
        
        /* 回転数エリア：高さを少し抑えてコンパクトに */
        .total-area { background: #1a1a1a; padding: 10px; border-radius: 12px; border: 2px solid var(--jug-gold); margin-bottom: 8px; text-align: center; }
        input[type="number"] { background: #333; color: #fff; border: none; font-size: 1.8rem; width: 60%; text-align: center; border-radius: 8px; padding: 5px; font-weight: bold; margin-bottom: 8px; }
        .quick-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .btn-q { background: #444; color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; }
        
        .summary-area { background: #000; padding: 8px; border-radius: 10px; border: 1px solid var(--bonus-blue); display: flex; justify-content: space-around; align-items: center; }
        .sum-val { font-size: 1.2rem; font-weight: bold; }
        .sum-prob { color: var(--jug-gold); font-weight: bold; font-size: 0.9rem; }

        /* グリッド：横幅いっぱいに収まるよう調整 */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; }
        .card { background: #1a1a1a; border-radius: 10px; padding: 8px; text-align: center; border: 1px solid #333; box-sizing: border-box; }
        
        .grape { border-top: 4px solid var(--good-green); }
        .cherry { border-top: 4px solid var(--cherry-orange); }
        .big { border-top: 4px solid var(--big-red); }
        .reg { border-top: 4px solid var(--jug-pink); }
        .ch-big { border-top: 4px dashed var(--big-red); }
        .ch-reg { border-top: 4px dashed var(--jug-pink); }
        
        .label { font-size: 0.8rem; font-weight: bold; color: #ccc; }
        .count-val { font-size: 2rem; font-weight: bold; margin: 2px 0; line-height: 1.2; }
        .prob { color: var(--jug-gold); font-size: 0.85rem; font-weight: bold; min-height: 1rem; }
        
        /* ボタンサイズをスマホに最適化 */
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 12px; border-radius: 8px; font-size: 1.5rem; cursor: pointer; margin-top: 5px; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #444; padding: 4px; border-radius: 4px; font-size: 0.7rem; margin-top: 5px; width: 100%; }
        
        .judge-msg { font-size: 0.65rem; margin-top: 5px; font-weight: bold; color: #666; }
        .good { color: var(--good-green); }
        .bad { color: #ff4444; }
        .top-judge { font-size: 0.9rem; color: var(--good-green); font-weight: bold; margin-top: 4px; }

        .reset-container { margin-top: 20px; text-align: center; padding-bottom: 20px; }
        .btn-reset { background: #cc0000; color: white; border: none; padding: 10px 20px; border-radius: 50px; font-size: 0.8rem; }
        .notes { font-size: 0.65rem; color: #666; text-align: left; padding: 10px; border-top: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <div class="total-area">
        <input type="number" id="totalDisplay" value="0" oninput="updateFromInput()" inputmode="numeric">
        <div class="quick-btns">
            <button class="btn-q" onclick="addG(1)">+1</button>
            <button class="btn-q" onclick="addG(10)">+10</button>
            <button class="btn-q" onclick="addG(100)">+100</button>
        </div>
        <div class="summary-area">
            <div class="sum-val" id="total-bonus-count">0</div>
            <div class="sum-prob" id="total-bonus-prob">-</div>
        </div>
        <div id="total-judge" class="top-judge"></div>
    </div>

    <div class="grid" id="counterGrid"></div>

    <div class="reset-container">
        <button class="btn-reset" onclick="res()">全リセット</button>
    </div>
    <div class="notes">
        ※シリーズ全体の平均値を参考にした目安です。遊技は自己責任でお願いします。
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('j-state-v9')) || {
        totalG: 0,
        counts: [0, 0, 0, 0, 0, 0], 
        labels: ["ブドウ", "チェリー", "単独BIG", "単独REG", "チェ重BIG", "チェ重REG"],
        classes: ["grape", "cherry", "big", "reg", "ch-big", "ch-reg"]
    };

    function save() { localStorage.setItem('j-state-v9', JSON.stringify(state)); render(); }
    function addG(val) { state.totalG += val; save(); }
    function updateFromInput() {
        const val = document.getElementById('totalDisplay').value;
        state.totalG = val === "" ? 0 : parseInt(val);
        localStorage.setItem('j-state-v9', JSON.stringify(state));
        render();
    }
    function up(i) { state.counts[i]++; save(); }
    function down(i) { if(state.counts[i] > 0) state.counts[i]--; save(); }
    function res() { if(confirm("全リセットしますか？")) { state.totalG = 0; state.counts = [0,0,0,0,0,0]; save(); } }

    function render() {
        document.getElementById('totalDisplay').value = state.totalG;
        const grid = document.getElementById('counterGrid');
        grid.innerHTML = '';

        const bigTotal = state.counts[2] + state.counts[4];
        const regTotal = state.counts[3] + state.counts[5];
        const bonusTotal = bigTotal + regTotal;
        const bonusProb = state.totalG > 0 && bonusTotal > 0 ? (state.totalG / bonusTotal).toFixed(1) : "-";

        document.getElementById('total-bonus-count').innerText = "合算:" + bonusTotal;
        document.getElementById('total-bonus-prob').innerText = bonusProb !== "-" ? "1 / " + bonusProb : "-";

        const topJudge = document.getElementById('total-judge');
        if(state.totalG >= 500 && bonusProb !== "-") {
            if(bonusProb < 135) topJudge.innerText = "🔥 高設定期待！";
            else if(bonusProb > 160) topJudge.innerText = "💀 厳しい状況";
            else topJudge.innerText = "⚖️ 中間付近";
        } else { topJudge.innerText = ""; }

        state.counts.forEach((v, i) => {
            const p = state.totalG > 0 && v > 0 ? (state.totalG / v).toFixed(1) : "-";
            const card = document.createElement('div');
            card.className = `card ${state.classes[i]}`;
            
            let judge = "-";
            let judgeClass = "judge-msg";
            if(state.totalG >= 500) {
                if(i === 0) {
                    const prob = state.totalG / v;
                    if(prob < 6.0) { judge = "高設定並"; judgeClass += " good"; }
                    else if(prob > 6.2) { judge = "低設定域"; judgeClass += " bad"; }
                } else if(i === 3 || i === 5) { // REG
                    const rProb = state.totalG / regTotal;
                    if(rProb < 300) { judge = "REG良し"; judgeClass += " good"; }
                }
            } else { judge = "500G〜判定"; }

            card.innerHTML = `
                <div class="label">${state.labels[i]}</div>
                <div class="count-val">${v}</div>
                <div class="prob">1/${p}</div>
                <button class="btn-up" onclick="up(${i})">＋</button>
                <button class="btn-minus" onclick="down(${i})">－1</button>
                <div class="${judgeClass}">${judge}</div>
            `;
            grid.appendChild(card);
        });
    }
    render();
</script>

</body>
</html>
