<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>J-Counter Pro</title>
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --big-red: #ff0000; --cherry-orange: #ff8c00; --bonus-blue: #00d4ff; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden; }
        .container { max-width: 100%; height: 100vh; display: flex; flex-direction: column; }

        /* ★広告エリア（上部）★ */
        .ad-top { width: 100%; min-height: 50px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #555; }

        .main-content { flex: 1; padding: 4px; display: flex; flex-direction: column; overflow: hidden; }
        
        .total-area { background: #1a1a1a; padding: 4px; border-radius: 8px; border: 1px solid var(--jug-gold); margin-bottom: 4px; }
        .drum-container { display: flex; justify-content: center; align-items: center; gap: 2px; }
        .drum-digit { display: flex; flex-direction: row; align-items: center; background: #333; border-radius: 4px; }
        .drum-val { font-size: 1.5rem; font-weight: bold; width: 25px; text-align: center; }
        .btn-arrow { background: none; border: none; color: var(--jug-gold); width: 30px; height: 35px; font-size: 1.2rem; cursor: pointer; }
        
        .summary-area { display: flex; justify-content: space-around; font-size: 0.85rem; margin-top: 2px; border-top: 1px solid #333; padding-top: 2px; }
        .sum-prob { color: var(--jug-gold); font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; flex: 1; }
        .card { background: #1a1a1a; border-radius: 6px; padding: 4px; text-align: center; border: 1px solid #333; display: flex; flex-direction: column; justify-content: center; }
        .count-val { font-size: 1.6rem; font-weight: bold; line-height: 1.1; }
        .prob { color: var(--jug-gold); font-size: 0.75rem; font-weight: bold; }
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 8px 0; border-radius: 4px; font-size: 1.3rem; margin-top: 2px; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #444; padding: 1px; border-radius: 3px; font-size: 0.6rem; margin-top: 2px; }
        .judge-msg { font-size: 0.55rem; color: #555; margin-top: 1px; }

        /* ★広告エリア（下部）★ */
        .ad-bottom { width: 100%; min-height: 50px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 0.6rem; color: #555; }

        .footer { display: flex; justify-content: space-between; align-items: center; padding: 2px 10px; background: #000; }
        .btn-reset, .btn-settings { background: #333; color: white; border: none; padding: 4px 12px; border-radius: 15px; font-size: 0.65rem; }
        
        #settings-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; padding: 20px; box-sizing: border-box; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container">
    <div class="ad-top">
        スポンサーリンク
    </div>

    <div class="main-content">
        <div class="total-area">
            <div class="drum-container">
                <div class="drum-digit"><button class="btn-arrow" onclick="drum(1000,-1)">▼</button><div id="d4" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1000,1)">▲</button></div>
                <div class="drum-digit"><button class="btn-arrow" onclick="drum(100,-1)">▼</button><div id="d3" class="drum-val">0</div><button class="btn-arrow" onclick="drum(100,1)">▲</button></div>
                <div class="drum-digit"><button class="btn-arrow" onclick="drum(10,-1)">▼</button><div id="d2" class="drum-val">0</div><button class="btn-arrow" onclick="drum(10,1)">▲</button></div>
                <div class="drum-digit"><button class="btn-arrow" onclick="drum(1,-1)">▼</button><div id="d1" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1,1)">▲</button></div>
            </div>
            <div class="summary-area">
                <div id="total-bonus-count">合算:0</div>
                <div id="total-bonus-prob" class="sum-prob">1/-</div>
                <div id="total-judge" style="color:var(--good-green); font-weight:bold;"></div>
            </div>
        </div>

        <div class="grid" id="counterGrid"></div>
    </div>

    <div class="ad-bottom">
        スポンサーリンク
    </div>

    <div class="footer">
        <button class="btn-settings" onclick="toggleSettings()">規約・ポリシー</button>
        <button class="btn-reset" onclick="res()">リセット</button>
    </div>

    <div id="settings-overlay">
        <button style="background:var(--jug-gold); padding:10px; border-radius:5px; border:none; font-weight:bold;" onclick="toggleSettings()">閉じる</button>
        <div style="font-size:0.8rem; margin-top:20px; color:#ccc;">
            <h3>プライバシーポリシー</h3>
            <p>当アプリはLocalStorageを使用します。データはデバイス内保存のみです。</p>
            <h3>免責事項</h3>
            <p>本アプリは目安であり、勝利を保証しません。自己責任でご使用ください。</p>
        </div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('j-state-v14')) || {
        totalG: 0,
        counts: [0, 0, 0, 0, 0, 0], 
        labels: ["ブドウ", "チェリー", "単BIG", "単REG", "重BIG", "重REG"],
        classes: ["grape", "cherry", "big", "reg", "ch-big", "ch-reg"]
    };

    function toggleSettings() {
        const el = document.getElementById('settings-overlay');
        el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function save() { 
        localStorage.setItem('j-state-v14', JSON.stringify(state)); 
        updateDrumDisplay();
        render(); 
    }

    function drum(unit, dir) {
        let currentDigit = Math.floor(state.totalG / unit) % 10;
        let nextDigit = (currentDigit + dir + 10) % 10;
        state.totalG += (nextDigit - currentDigit) * unit;
        save();
    }

    function updateDrumDisplay() {
        let val = state.totalG;
        document.getElementById('d4').innerText = Math.floor(val / 1000 % 10);
        document.getElementById('d3').innerText = Math.floor(val / 100 % 10);
        document.getElementById('d2').innerText = Math.floor(val / 10 % 10);
        document.getElementById('d1').innerText = Math.floor(val % 10);
    }

    function up(i) { state.counts[i]++; save(); }
    function down(i) { if(state.counts[i] > 0) state.counts[i]--; save(); }
    function res() { if(confirm("リセット？")) { state.totalG = 0; state.counts = [0,0,0,0,0,0]; save(); } }

    function render() {
        const grid = document.getElementById('counterGrid');
        grid.innerHTML = '';
        const bigTotal = state.counts[2] + state.counts[4];
        const regTotal = state.counts[3] + state.counts[5];
        const bonusTotal = bigTotal + regTotal;
        const bonusProb = state.totalG > 0 && bonusTotal > 0 ? (state.totalG / bonusTotal).toFixed(1) : "-";

        document.getElementById('total-bonus-count').innerText = "合算:" + bonusTotal;
        document.getElementById('total-bonus-prob').innerText = "1/" + bonusProb;

        const topJudge = document.getElementById('total-judge');
        if(state.totalG >= 500 && bonusProb !== "-") {
            if(bonusProb < 135) topJudge.innerText = "★高設定域";
            else if(bonusProb > 165) topJudge.innerText = "▲低設定域";
            else topJudge.innerText = "●中間域";
        } else { topJudge.innerText = ""; }

        state.counts.forEach((v, i) => {
            const p = state.totalG > 0 && v > 0 ? (state.totalG / v).toFixed(1) : "-";
            const card = document.createElement('div');
            card.className = `card ${state.classes[i]}`;
            let judgeText = state.totalG >= 500 ? "-" : "500G〜";
            card.innerHTML = `<div style="font-size:0.7rem; font-weight:bold; color:#ccc;">${state.labels[i]}</div><div class="count-val">${v}</div><div class="prob">1/${p}</div><button class="btn-up" onclick="up(${i})">＋</button><button class="btn-minus" onclick="down(${i})">－1</button><div class="judge-msg">${judgeText}</div>`;
            grid.appendChild(card);
        });
    }
    updateDrumDisplay();
    render();
</script>

</body>
</html>
