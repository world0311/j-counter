<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>J-Counter Visual-Red</title>
    <style>
        :root { --jug-purple: #4b0082; --jug-pink: #ff1493; --jug-gold: #ffd700; --good-green: #00ff00; --cherry-red: #ff0000; --big-red: #d32f2f; --bonus-blue: #00d4ff; }
        body { font-family: sans-serif; background: #000; color: white; margin: 0; padding: 4px; padding-bottom: env(safe-area-inset-bottom); -webkit-tap-highlight-color: transparent; touch-action: manipulation; overflow: hidden; box-sizing: border-box; }
        
        .container { max-width: 100%; height: 98vh; display: flex; flex-direction: column; }
        .ad-top { font-size: 0.6rem; color: #444; text-align: center; margin-bottom: 2px; }

        .total-area { background: #1a1a1a; padding: 3px; border-radius: 8px; border: 1px solid var(--jug-gold); margin-bottom: 3px; }
        .drum-container { display: flex; justify-content: center; align-items: center; gap: 2px; }
        .drum-digit { display: flex; flex-direction: row; align-items: center; background: #333; border-radius: 4px; }
        .drum-val { font-size: 1.3rem; font-weight: bold; width: 22px; text-align: center; }
        .btn-arrow { background: none; border: none; color: var(--jug-gold); width: 26px; height: 30px; font-size: 1rem; cursor: pointer; padding: 0; }
        
        .summary-area { display: flex; justify-content: space-around; font-size: 0.75rem; margin-top: 2px; border-top: 1px solid #333; padding-top: 2px; }
        .sum-prob { color: var(--jug-gold); font-weight: bold; }

        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; flex: 1; min-height: 0; }
        .card { background: #1a1a1a; border-radius: 6px; padding: 2px; text-align: center; border: 1.5px solid #333; display: flex; flex-direction: column; justify-content: space-between; }
        
        /* 枠の色を緑と赤に指定 */
        .grape { border: 2px solid var(--good-green) !important; box-shadow: 0 0 5px rgba(0, 255, 0, 0.2); }
        .cherry { border: 2px solid var(--cherry-red) !important; box-shadow: 0 0 5px rgba(255, 0, 0, 0.2); }
        
        /* 上部の線も維持 */
        .big { border-top: 4px solid var(--big-red); }
        .reg { border-top: 4px solid var(--jug-pink); }
        .ch-big { border-top: 4px dashed var(--big-red); }
        .ch-reg { border-top: 4px dashed var(--jug-pink); }
        
        .label { font-size: 0.65rem; font-weight: bold; color: #ccc; }
        .count-val { font-size: 1.4rem; font-weight: bold; line-height: 1; }
        .prob { color: var(--jug-gold); font-size: 0.7rem; font-weight: bold; }
        
        .btn-up { background: #333; color: white; width: 100%; border: 1px solid #555; padding: 6px 0; border-radius: 4px; font-size: 1.2rem; }
        .btn-minus { background: none; color: #ff4444; border: 1px solid #444; padding: 1px; border-radius: 3px; font-size: 0.55rem; margin-top: 1px; }
        .judge-msg { font-size: 0.5rem; color: #555; }

        .footer { margin-top: 4px; padding-bottom: 20px; }
        .ad-bottom { font-size: 0.6rem; color: #444; text-align: center; margin-bottom: 4px; }
        .footer-btns { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
        .btn-reset { background: #cc0000; color: white; border: none; padding: 4px 10px; border-radius: 10px; font-size: 0.6rem; }
        .legal-links { font-size: 0.55rem; color: #666; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="ad-top">スポンサーリンク</div>

    <div class="total-area">
        <div class="drum-container">
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(1000,-1)">▼</button><div id="d4" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1000,1)">▲</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(100,-1)">▼</button><div id="d3" class="drum-val">0</div><button class="btn-arrow" onclick="drum(100,1)">▲</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(10,-1)">▼</button><div id="d2" class="drum-val">0</div><button class="btn-arrow" onclick="drum(10,1)">▲</button></div>
            <div class="drum-digit"><button class="btn-arrow" onclick="drum(1,-1)">▼</button><div id="d1" class="drum-val">0</div><button class="btn-arrow" onclick="drum(1,1)">▲</button></div>
        </div>
        <div class="summary-area">
            <div id="total-bonus-count">合算:0</div>
            <div id="total-bonus-prob" class="sum-prob">1/-</div>
            <div id="total-judge" style="color:var(--good-green); font-weight:bold;"></div>
        </div>
    </div>

    <div class="grid" id="counterGrid"></div>

    <div class="footer">
        <div class="ad-bottom">スポンサーリンク</div>
        <div class="footer-btns">
            <a href="#" class="legal-links">規約/プライバシー</a>
            <button class="btn-reset" onclick="res()">リセット</button>
        </div>
    </div>
</div>

<script>
    let state = JSON.parse(localStorage.getItem('j-state-v16')) || {
        totalG: 0,
        counts: [0, 0, 0, 0, 0, 0], 
        labels: ["ブドウ", "チェリー", "単BIG", "単REG", "重BIG", "重REG"],
        classes: ["grape", "cherry", "big", "reg", "ch-big", "ch-reg"]
    };

    function save() { 
        localStorage.setItem('j-state-v16', JSON.stringify(state)); 
        updateDrumDisplay();
        render(); 
    }

    function drum(unit, dir) {
        let currentDigit = Math.floor(state.totalG / unit) % 10;
        let nextDigit = (currentDigit + dir + 10) % 10;
        state.totalG += (nextDigit - currentDigit) * unit;
        save();
    }

    function updateDrumDisplay() {
        let val = state.totalG;
        document.getElementById('d4').innerText = Math.floor(val / 1000 % 10);
        document.getElementById('d3').innerText = Math.floor(val / 100 % 10);
        document.getElementById('d2').innerText = Math.floor(val / 10 % 10);
        document.getElementById('d1').innerText = Math.floor(val % 10);
    }

    function up(i) { state.counts[i]++; save(); }
    function down(i) { if(state.counts[i] > 0) state.counts[i]--; save(); }
    function res() { if(confirm("リセット？")) { state.totalG = 0; state.counts = [0,0,0,0,0,0]; save(); } }

    function render() {
        const grid = document.getElementById('counterGrid');
        grid.innerHTML = '';
        const bigTotal = state.counts[2] + state.counts[4];
        const regTotal = state.counts[3] + state.counts[5];
        const bonusTotal = bigTotal + regTotal;
        const bonusProb = state.totalG > 0 && bonusTotal > 0 ? (state.totalG / bonusTotal).toFixed(1) : "-";

        document.getElementById('total-bonus-count').innerText = "合算:" + bonusTotal;
        document.getElementById('total-bonus-prob').innerText = "1/" + bonusProb;

        const topJudge = document.getElementById('total-judge');
        if(state.totalG >= 500 && bonusProb !== "-") {
            if(bonusProb < 135) topJudge.innerText = "★高";
            else if(bonusProb > 165) topJudge.innerText = "▲低";
            else topJudge.innerText = "●中";
        } else { topJudge.innerText = ""; }

        state.counts.forEach((v, i) => {
            const p = state.totalG > 0 && v > 0 ? (state.totalG / v).toFixed(1) : "-";
            const card = document.createElement('div');
            card.className = `card ${state.classes[i]}`;
            
            let judgeText = "500G〜";
            if(state.totalG >= 500) {
                judgeText = "-";
                if(i === 0 && state.totalG/v < 6.0) { judgeText = "良"; }
                if((i === 3 || i === 5) && (state.totalG/regTotal < 300)) { judgeText = "良"; }
            }

            card.innerHTML = `
                <div class="label">${state.labels[i]}</div>
                <div class="count-val">${v}</div>
                <div class="prob">1/${p}</div>
                <button class="btn-up" onclick="up(${i})">＋</button>
                <button class="btn-minus" onclick="down(${i})">－</button>
                <div class="judge-msg">${judgeText}</div>
            `;
            grid.appendChild(card);
        });
    }
    updateDrumDisplay();
    render();
</script>

</body>
</html>
